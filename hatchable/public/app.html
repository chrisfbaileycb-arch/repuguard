<!DOCTYPE html>
<html lang="en">

<!-- Own-origin UMD globals. No runtime CDN dependency for app JS: a blocked
     CDN would render this page permanently blank. -->
<script src="/vendor/react.js"></script>

<script src="/vendor/htm.js"></script>

<style>
  .shell { display:flex; min-height:100vh; }
  .side { width:230px; flex:0 0 230px; border-right:1px solid var(--line-soft); background:var(--surface);
          display:flex; flex-direction:column; padding:20px 0; }
  .side .mark { display:flex; align-items:center; gap:10px; padding:0 20px 22px; }
  .side .badge { width:31px; height:31px; border-radius:9px; display:grid; place-items:center;
                 background:linear-gradient(135deg,var(--accent),var(--accent-dim)); }
  .side b { font-family:var(--font); font-size:16px; }
  .nav { display:flex; flex-direction:column; gap:2px; padding:0 12px; }
  .nav button { display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
                padding:10px 12px; background:none; border:0; border-radius:var(--radius-sm);
                color:var(--text-dim); font:inherit; font-size:14px; font-weight:550; cursor:pointer; text-align:left; }
  .nav button:hover { background:rgba(255,255,255,0.04); color:var(--text); }
  .nav button.on { background:rgba(0,201,255,0.12); color:var(--accent); }
  .side .foot { margin-top:auto; padding:16px 20px 0; border-top:1px solid var(--line-soft); }

  .main { flex:1; min-width:0; padding:28px 30px 60px; }
  .top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; }
  .top h1 { font-size:23px; margin-bottom:4px; }

  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(184px,1fr)); gap:14px; margin-bottom:24px; }
  .stat .k { font-size:11px; letter-spacing:0.07em; text-transform:uppercase; color:var(--text-faint); margin-bottom:9px; }
  .stat .v { font-family:var(--font); font-size:29px; letter-spacing:-0.02em; line-height:1; }
  .stat .s { font-size:12px; color:var(--text-faint); margin-top:6px; }

  .rev { border-bottom:1px solid var(--line-soft); padding:16px 0; }
  .rev:last-child { border-bottom:0; }
  .rev .hd { display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:7px; }
  .rev .who { font-weight:650; font-size:14px; }
  .rev .body { font-size:14px; color:var(--text-dim); line-height:1.6; margin:0 0 10px; }
  .reply { background:var(--ink); border:1px solid var(--line-soft); border-left:2px solid var(--accent-dim);
           border-radius:var(--radius-sm); padding:12px 14px; margin-top:10px; }
  .reply .lb { font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; color:var(--text-faint); margin-bottom:6px; }
  .reply p { margin:0; font-size:13.5px; line-height:1.6; color:var(--text-dim); }
  .acts { display:flex; gap:8px; margin-top:11px; flex-wrap:wrap; }

  .stars { color:var(--warn); letter-spacing:1px; font-size:13px; }
  .empty { text-align:center; padding:52px 22px; }
  .empty h3 { font-size:17px; margin-bottom:9px; }
  .empty p { color:var(--text-dim); font-size:14px; max-width:46ch; margin:0 auto 20px; line-height:1.62; }

  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 20px; }
  .narrow { width:100%; max-width:470px; }

  .planbox { background:var(--ink); border:1px solid var(--accent-dim); border-radius:var(--radius-sm);
             padding:17px 18px; margin:18px 0 20px; }
  .planbox .hd { display:flex; flex-direction:column; gap:3px; padding-bottom:13px;
                 border-bottom:1px solid var(--line-soft); margin-bottom:13px; }
  .planbox .pr { font-family:var(--font); font-weight:700; font-size:29px; line-height:1.1; }
  .planbox .per { font-size:13px; font-weight:400; color:var(--text-faint); margin-left:2px; }
  .planbox .ft { font-size:13px; color:var(--text-dim); }
  .planbox ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .planbox li { font-size:13px; color:var(--text-dim); line-height:1.5; padding-left:17px; position:relative; }
  .planbox li::before { content:'✓'; position:absolute; left:0; color:var(--ok); font-weight:700; font-size:12px; }

  @media (max-width: 860px) {
    .shell { flex-direction:column; }
    .side { width:100%; flex:none; border-right:0; border-bottom:1px solid var(--line-soft); }
    .nav { flex-direction:row; overflow-x:auto; }
    .side .foot { border-top:0; }
    .main { padding:22px 18px 50px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useCallback } = React;

// React's `style` prop takes an object, not a string: given a string it throws
// React error #62 and renders NOTHING, silently, with no visible exception.
// htm is HTML-shaped, so `style="color:red"` arrives here as a string and every
// styled component would come out blank. Convert it at the binding, once, so
// ordinary inline-CSS syntax works throughout the file.
const styleCache = new Map();
function toStyleObject(text) {
  if (!text) return undefined;
  if (styleCache.has(text)) return styleCache.get(text);
  const obj = {};
  for (const decl of String(text).split(';')) {
    const i = decl.indexOf(':');
    if (i === -1) continue;
    const prop = decl.slice(0, i).trim();
    const value = decl.slice(i + 1).trim();
    if (!prop || !value) continue;
    // Custom properties (--foo) must keep their exact name; everything else
    // becomes camelCase the way React expects.
    const key = prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (m, c) => c.toUpperCase());
    obj[key] = value;
  }
  styleCache.set(text, obj);
  return obj;
}

const html = htm.bind(function (type, props, ...children) {
  if (props && typeof props.style === 'string') {
    props = Object.assign({}, props, { style: toStyleObject(props.style) });
  }
  return React.createElement(type, props, ...children);
});

/* ---------- helpers ---------- */

async function api(path, options) {
  const res = await fetch(path, Object.assign({
    headers: { 'Content-Type': 'application/json' },
  }, options || {}));
  let data = null;
  try { data = await res.json(); } catch (e) { data = {}; }
  if (!res.ok) {
    const err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
    err.status = res.status;
    err.code = data && data.code;
    err.data = data;
    throw err;
  }
  return data;
}

const qs = new URLSearchParams(location.search);

function stars(n) {
  if (!n) return '—';
  return '★'.repeat(n) + '☆'.repeat(5 - n);
}

function Spinner({ label }) {
  return html`<div style="display:flex;align-items:center;gap:9px;color:var(--text-faint);font-size:14px">
    <span class="spinner"></span>${label || 'Loading…'}
  </div>`;
}

function Pill({ kind, children }) {
  return html`<span class="pill pill-${kind}">${children}</span>`;
}

function statusPill(status) {
  const map = {
    escalated: 'danger', pending: 'warn', approved: 'ok',
    published: 'ok', new: 'accent', archived: 'mute',
  };
  return html`<${Pill} kind=${map[status] || 'mute'}>${status}<//>`;
}

/* ---------- payment wall ---------- */

function PaymentWall({ business, billing, onRefresh, notice }) {
  // One plan, so there is nothing to pick. The wall states the price and
  // takes the commitment; the only decision left is yes or no.
  const plan = (billing && billing.plan_detail) || null;
  const [agreed, setAgreed] = useState(false);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  const months = (billing && billing.commitment_months) || 6;

  async function pay() {
    setBusy(true);
    setError('');
    try {
      const out = await api('/api/billing/checkout', {
        method: 'POST',
        body: JSON.stringify({ business_id: business.id }),
      });
      if (out.url) { location.href = out.url; return; }
      setError('Checkout did not return a payment link. Please try again.');
    } catch (e) {
      if (e.code === 'stripe_not_configured' || e.code === 'price_not_configured') {
        setError('Payments are not connected yet. The account owner needs to add the Stripe keys in the Hatchable console.');
      } else {
        setError(e.message || 'Could not start checkout.');
      }
    }
    setBusy(false);
  }

  const pastDue = billing && billing.status === 'past_due';
  const canceled = billing && billing.status === 'canceled';

  return html`
    <div class="center">
      <div class="narrow">
        ${notice}
        <div class="card">
          <h1 style="font-size:20px;margin-bottom:6px">
            ${canceled ? 'Reactivate ' + business.name : 'Activate ' + business.name}
          </h1>
          <p class="muted" style="font-size:14px;line-height:1.6;margin:0 0 4px">
            ${pastDue
              ? 'Your last payment did not go through. Update your card to keep monitoring running.'
              : 'One plan, one price. Start monitoring reviews for this business.'}
          </p>

          <div class="planbox">
            <div class="hd">
              <span class="pr">$${plan ? plan.price : 49}<span class="per">/month</span></span>
              <span class="ft">${plan ? plan.tagline : 'Everything, for one location.'}</span>
            </div>
            <ul>
              ${(plan ? plan.features : []).map((f) => html`<li key=${f}>${f}</li>`)}
            </ul>
          </div>

          <label style="display:flex;gap:10px;align-items:flex-start;background:rgba(242,166,59,0.07);
                        border:1px solid rgba(242,166,59,0.26);border-radius:var(--radius-sm);
                        padding:13px 15px;cursor:pointer;margin-bottom:16px">
            <input type="checkbox" checked=${agreed} onChange=${(e) => setAgreed(e.target.checked)}
                   style="margin-top:3px;accent-color:var(--accent);flex:0 0 auto" />
            <span style="font-size:13px;line-height:1.6" class="muted">
              I agree to the ${months}-month minimum commitment
              ${plan ? html` — $${plan.price}/month, $${plan.price * months} in total` : null}.
            </span>
          </label>

          ${error ? html`<div class="banner banner-danger">${error}</div>` : null}

          <button class="btn btn-primary" style="width:100%"
                  disabled=${busy || !agreed || !plan}
                  onClick=${pay}>
            ${busy
              ? html`<span class="spinner"></span> Opening secure checkout…`
              : plan ? 'Pay $' + plan.price + '/mo and activate' : 'Loading…'}
          </button>

          <p class="faint" style="font-size:12px;text-align:center;margin:14px 0 0">
            Secured by Stripe. Your card details never reach RepuGuard.
          </p>
        </div>

        <div style="display:flex;justify-content:space-between;margin-top:16px">
          <button class="btn btn-ghost btn-sm" onClick=${onRefresh}>Already paid? Refresh</button>
          <button class="btn btn-ghost btn-sm"
                  onClick=${() => hatchable.auth.signOut().then(() => location.href = '/')}>Sign out</button>
        </div>
      </div>
    </div>
  `;
}

/* ---------- onboarding ---------- */

function CreateBusiness({ onCreated }) {
  const [form, setForm] = useState({ name: '', industry: '', website: '' });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState('');

  function set(k, v) { setForm((f) => Object.assign({}, f, { [k]: v })); }

  async function submit(e) {
    e.preventDefault();
    if (form.name.trim().length < 2) { setError('Please enter your business name.'); return; }
    setBusy(true); setError('');
    try {
      const out = await api('/api/businesses', { method: 'POST', body: JSON.stringify(form) });
      onCreated(out.business);
    } catch (err) {
      setError(err.message || 'Could not create the business.');
      setBusy(false);
    }
  }

  return html`
    <div class="center">
      <div class="narrow">
        <div class="card">
          <h1 style="font-size:20px;margin-bottom:6px">Tell us about your business</h1>
          <p class="muted" style="font-size:14px;line-height:1.6;margin:0 0 20px">
            This is the name that appears in your replies.
          </p>
          <form onSubmit=${submit} style="display:flex;flex-direction:column;gap:15px">
            <div>
              <label class="label">Business name</label>
              <input class="input" value=${form.name} placeholder="Downtown Dental"
                     onInput=${(e) => set('name', e.target.value)} />
            </div>
            <div>
              <label class="label">Industry</label>
              <input class="input" value=${form.industry} placeholder="Dental practice"
                     onInput=${(e) => set('industry', e.target.value)} />
            </div>
            <div>
              <label class="label">Website</label>
              <input class="input" value=${form.website} placeholder="https://example.com"
                     onInput=${(e) => set('website', e.target.value)} />
            </div>
            <div>
              <p class="faint" style="font-size:12px;margin:0;line-height:1.55">
                Reviews needing your attention appear on your dashboard. We send no email.
              </p>
            </div>
            ${error ? html`<div class="banner banner-danger">${error}</div>` : null}
            <button class="btn btn-primary" type="submit" disabled=${busy}>
              ${busy ? html`<span class="spinner"></span> Creating…` : 'Continue'}
            </button>
          </form>
        </div>
      </div>
    </div>
  `;
}

/* ---------- team ---------- */

function Team({ businessId }) {
  const [data, setData] = useState(null);
  const [email, setEmail] = useState('');
  const [role, setRole] = useState('manager');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);

  const load = useCallback(async () => {
    try { setData(await api('/api/businesses/' + businessId + '/team')); }
    catch (e) { setMsg({ kind: 'danger', text: e.message }); }
  }, [businessId]);

  useEffect(() => { load(); }, [load]);

  async function invite(e) {
    e.preventDefault();
    setBusy(true);
    setMsg(null);
    try {
      const out = await api('/api/businesses/' + businessId + '/team', {
        method: 'POST',
        body: JSON.stringify({ email: email.trim(), role: role }),
      });
      setEmail('');
      setMsg({ kind: 'ok', text: out.instructions });
      await load();
    } catch (e2) {
      setMsg({ kind: 'danger', text: e2.message });
    }
    setBusy(false);
  }

  async function remove(body) {
    setBusy(true);
    try {
      await api('/api/businesses/' + businessId + '/team', { method: 'DELETE', body: JSON.stringify(body) });
      await load();
    } catch (e) { setMsg({ kind: 'danger', text: e.message }); }
    setBusy(false);
  }

  if (!data) return html`<div class="card"><${Spinner} /><//>`;

  const { seats, members, invites } = data;
  const isOwner = members.some((m) => m.is_you && m.role === 'owner');

  return html`
    <div style="max-width:560px">
      ${msg ? html`<div class=${'banner banner-' + msg.kind}>${msg.text}</div>` : null}

      <div class="card" style="margin-bottom:18px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h3 style="font-size:16px;margin:0">Who can sign in</h3>
          <${Pill} kind=${seats.remaining ? 'mute' : 'warn'}>${seats.used} of ${seats.max}<//>
        </div>

        ${members.map((m, i) => html`
          <div key=${'m' + i} style="display:flex;justify-content:space-between;align-items:center;gap:12px;
                                     padding:11px 0;border-bottom:1px solid var(--line-soft)">
            <span style="font-size:14px">
              ${m.is_you ? 'You' : 'Team member'}
              <span class="faint" style="font-size:12px"> · ${m.role}</span>
            </span>
            ${isOwner && !m.is_you && m.role !== 'owner' ? html`
              <button class="btn btn-ghost btn-sm" disabled=${busy}
                      onClick=${() => remove({ user_id: m.user_id })}>Remove</button>` : null}
          </div>
        `)}

        ${invites.map((iv) => html`
          <div key=${iv.id} style="display:flex;justify-content:space-between;align-items:center;gap:12px;
                                   padding:11px 0;border-bottom:1px solid var(--line-soft)">
            <span style="font-size:14px">
              ${iv.email}
              <span class="faint" style="font-size:12px"> · invited, not signed in yet</span>
            </span>
            ${isOwner ? html`
              <button class="btn btn-ghost btn-sm" disabled=${busy}
                      onClick=${() => remove({ invite_id: iv.id })}>Withdraw</button>` : null}
          </div>
        `)}
      </div>

      ${isOwner ? html`
        <div class="card">
          <h3 style="font-size:15px;margin-bottom:6px">Add someone</h3>
          <p class="muted" style="font-size:13px;line-height:1.6;margin:0 0 14px">
            ${seats.remaining > 0
              ? `You have ${seats.remaining} seat${seats.remaining === 1 ? '' : 's'} left. They sign in with their own email — there is no invitation email to wait for.`
              : `All ${seats.max} seats are in use. Remove someone to add another.`}
          </p>
          <form onSubmit=${invite} style="display:flex;flex-direction:column;gap:11px">
            <input class="input" type="email" placeholder="them@example.com"
                   disabled=${busy || seats.remaining <= 0}
                   value=${email} onInput=${(e) => setEmail(e.target.value)} />
            <select class="input" value=${role} disabled=${busy || seats.remaining <= 0}
                    onChange=${(e) => setRole(e.target.value)}>
              <option value="manager">Manager — can reply and change settings</option>
              <option value="viewer">Viewer — can look, not change</option>
            </select>
            <button class="btn btn-primary" type="submit" disabled=${busy || seats.remaining <= 0 || !email.trim()}>
              ${busy ? html`<span class="spinner"></span> Adding…` : 'Add to account'}
            </button>
          </form>
        </div>` : null}
    </div>
  `;
}

/* ---------- reply settings ---------- */

function ReplySettings({ businessId, onSaved }) {
  const [state, setState] = useState(null);
  const [saving, setSaving] = useState(false);
  const [msg, setMsg] = useState(null);

  useEffect(() => {
    let cancelled = false;
    api('/api/businesses/' + businessId)
      .then((out) => { if (!cancelled) setState({ s: out.business.settings, cat: out.catalogue, role: out.business.role }); })
      .catch((e) => { if (!cancelled) setMsg({ kind: 'danger', text: e.message }); });
    return () => { cancelled = true; };
  }, [businessId]);

  if (!state) return html`<div class="card"><${Spinner} /><//>`;

  const { s, cat, role } = state;
  const readOnly = role !== 'owner';
  const set = (patch) => setState((st) => ({ ...st, s: { ...st.s, ...patch } }));

  function toggleTemplate(id) {
    const on = s.reply_template_ids || [];
    set({ reply_template_ids: on.includes(id) ? on.filter((x) => x !== id) : on.concat(id) });
  }

  function setCustom(i, value) {
    const next = [...(s.custom_replies || ['', ''])];
    next[i] = value;
    set({ custom_replies: next });
  }

  async function save() {
    setSaving(true);
    setMsg(null);
    try {
      // Blank strings are stripped from the request body in transit, so a
      // cleared field would silently keep its old value. null survives, and
      // the server reads it as "remove this".
      const blankToNull = (v) => (String(v || '').trim() === '' ? null : v);
      const payload = {
        ...s,
        signature: blankToNull(s.signature),
        custom_replies: (s.custom_replies || ['', '']).map(blankToNull),
      };
      const out = await api('/api/businesses/' + businessId, {
        method: 'PATCH',
        body: JSON.stringify({ settings: payload }),
      });
      setState((st) => ({ ...st, s: out.business.settings }));
      setMsg({ kind: 'ok', text: 'Saved.' });
      if (onSaved) await onSaved();
    } catch (e) {
      setMsg({ kind: 'danger', text: e.message });
    }
    setSaving(false);
  }

  // Everything the owner has switched on, so "always use this one" can only
  // offer replies that would actually be sent.
  const chosen = (s.reply_template_ids || []);
  const customFilled = (s.custom_replies || []).map((b, i) => ({ id: `custom_${i + 1}`, body: b }))
    .filter((c) => c.body && c.body.trim());
  const selectable = cat.templates.filter((t) => chosen.includes(t.id))
    .map((t) => ({ id: t.id, label: t.label }))
    .concat(customFilled.map((c, i) => ({ id: c.id, label: `My reply ${i + 1}` })));

  return html`
    <div style="max-width:640px">
      ${readOnly ? html`<div class="banner banner-info">Only the account owner can change these.</div>` : null}
      ${msg ? html`<div class=${'banner banner-' + msg.kind}>${msg.text}</div>` : null}

      <div class="card" style="margin-bottom:18px">
        <h3 style="font-size:16px;margin-bottom:6px">Good reviews</h3>
        <p class="muted" style="font-size:13.5px;line-height:1.6;margin:0 0 16px">
          Four stars and up get a thank-you automatically. Pick the ones that sound like you.
        </p>

        <label class="label">When a good review comes in</label>
        <select class="input" style="margin-bottom:18px" disabled=${readOnly}
                value=${s.auto_reply_mode}
                onChange=${(e) => set({ auto_reply_mode: e.target.value })}>
          ${cat.modes.map((m) => html`<option key=${m.id} value=${m.id}>${m.label}</option>`)}
        </select>

        ${s.auto_reply_mode !== 'off' ? html`
          <label class="label">Replies to use</label>
          <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:18px">
            ${cat.templates.map((t) => html`
              <label key=${t.id} style=${'display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:var(--radius-sm);cursor:' + (readOnly ? 'default' : 'pointer') + ';background:var(--ink);border:1px solid ' + (chosen.includes(t.id) ? 'var(--accent-dim)' : 'var(--line-soft)')}>
                <input type="checkbox" disabled=${readOnly}
                       checked=${chosen.includes(t.id)}
                       onChange=${() => toggleTemplate(t.id)}
                       style="margin-top:3px;accent-color:var(--accent);flex:0 0 auto" />
                <span>
                  <span style="font-size:13px;font-weight:600;display:block;margin-bottom:3px">${t.label}</span>
                  <span class="faint" style="font-size:12.5px;line-height:1.55">${t.body}</span>
                </span>
              </label>
            `)}
          </div>

          ${s.auto_reply_mode === 'single' ? html`
            <div style="margin-bottom:18px">
              <label class="label">Always use</label>
              <select class="input" disabled=${readOnly} value=${s.single_reply_id}
                      onChange=${(e) => set({ single_reply_id: e.target.value })}>
                ${selectable.length

        </p>

      ${!readOnly ? html`
        <button class="btn btn-primary" disabled=${saving} onClick=${save}>
          ${saving ? html`<span class="spinner"></span> Saving…` : 'Save changes'}
        </button>` : null}
    </div>
  `;
}

// Advice, not wording. The owner writes the reply; the whole point of the
// three-star rule is that nothing goes out under their name that they did not
// write themselves.
const LOW_RATING_GUIDANCE = [
  'Reply in your own words — a personal response reads very differently here.',
  'Acknowledge what went wrong and apologise plainly, without excuses.',
  'Say what you are doing about it, even if it is small and specific.',
  'Invite them to contact you directly and continue it off the review.',
  'Never offer money or a discount to change or remove a review — Google and Yelp both prohibit it.',
  'Do not mention private details of their visit or account in public.',
];

function NeedsReply({ items, count, businessId, onDone }) {
  const [busy, setBusy] = useState(null);
  const [openId, setOpenId] = useState(null);

  async function mark(alertId, action) {
    setBusy(alertId);
    try {
      await api('/api/businesses/' + businessId + '/escalations', {
        method: 'POST',
        body: JSON.stringify({ escalation_id: alertId, action: action }),
      });
      await onDone();
    } catch (e) { /* surfaced on reload */ }
    setBusy(null);
  }

  if (!items.length) {
    return html`<div class="card empty">
      <h3>Nothing needs you right now</h3>
      <p>
        Reviews you need to answer personally show up here — anything at three stars or below,
        and anything that arrived without a rating. Good reviews are thanked automatically.
      </p>
    </div>`;
  }

  return html`
    <div>
      <div class="banner banner-warn">
        ${count} review${count === 1 ? '' : 's'} need${count === 1 ? 's' : ''} a reply from you.
        We do not write these — a low rating deserves your own words.
      </div>
      <div class="card">
        ${items.map((r) => html`
          <div class="rev" key=${r.id}>
            <div class="hd">
              <span class="who">${r.author_name || 'Anonymous'}</span>
              <span class="stars">${r.rating ? stars(r.rating) : 'no rating'}</span>
              <span class="faint" style="font-size:12px;text-transform:capitalize">${r.platform}</span>
              <${Pill} kind=${r.priority === 'high' ? 'danger' : 'warn'}>${r.priority}<//>
              ${r.alert_status === 'acknowledged' ? html`<${Pill} kind="mute">seen<//>` : null}
            </div>
            <p class="body">${r.body}</p>
            <p class="faint" style="font-size:12.5px;margin:0">Why it is here: ${r.reason}</p>

            <div class="acts">
              <button class="btn btn-ghost btn-sm"
                      onClick=${() => setOpenId(openId === r.id ? null : r.id)}>
                ${openId === r.id ? 'Hide tips' : 'How to handle this'}
              </button>
              ${r.alert_status === 'open' ? html`
                <button class="btn btn-ghost btn-sm" disabled=${busy === r.alert_id}
                        onClick=${() => mark(r.alert_id, 'acknowledge')}>Mark as seen</button>` : null}
              <button class="btn btn-primary btn-sm" disabled=${busy === r.alert_id}
                      onClick=${() => mark(r.alert_id, 'resolve')}>I have replied</button>
            </div>

            ${openId === r.id ? html`
              <div style="margin-top:12px;background:var(--ink);border:1px solid var(--line-soft);
                          border-radius:var(--radius-sm);padding:14px 16px">
                <p class="faint" style="font-size:11px;letter-spacing:.07em;text-transform:uppercase;margin:0 0 9px">
                  Suggestions — not a script
                </p>
                <ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px">
                  ${LOW_RATING_GUIDANCE.map((g) => html`
                    <li key=${g} class="muted" style="font-size:13px;line-height:1.55">${g}</li>
                  `)}
                </ul>
              </div>
            ` : null}
          </div>
        `)}
      </div>
    </div>
  `;
}

function Reviews({ businessId }) {
  const [reviews, setReviews] = useState(null);
  const [filter, setFilter] = useState('');
  const [error, setError] = useState('');
  const [acting, setActing] = useState(null);

  const load = useCallback(async () => {
    setError('');
    try {
      const q = filter ? '?status=' + encodeURIComponent(filter) : '';
      const out = await api('/api/businesses/' + businessId + '/reviews' + q);
      setReviews(out.reviews);
    } catch (e) {
      setError(e.message);
      setReviews([]);
    }
  }, [businessId, filter]);

  useEffect(() => { load(); }, [load]);

  async function act(responseId, action) {
    setActing(responseId + action);
    setError('');
    try {
      await api('/api/businesses/' + businessId + '/responses/' + responseId, {
        method: 'POST',
        body: JSON.stringify({ action: action }),
      });
      await load();
    } catch (e) {
      setError(e.data && e.data.violations
        ? e.message + ' (' + e.data.violations.map((v) => v.rule).join(', ') + ')'
        : e.message);
    }
    setActing(null);
  }

  if (reviews === null) return html`<div class="card"><${Spinner} /><//>`;

  const tabs = [['', 'All'], ['escalated', 'Escalated'], ['pending', 'Pending'],
                ['approved', 'Approved'], ['published', 'Published']];

  return html`
    <div>
      <div style="display:flex;gap:7px;margin-bottom:16px;flex-wrap:wrap">
        ${tabs.map(([v, label]) => html`
          <button key=${v} class=${'btn btn-sm ' + (filter === v ? 'btn-primary' : 'btn-ghost')}
                  onClick=${() => setFilter(v)}>${label}</button>
        `)}
      </div>

      ${error ? html`<div class="banner banner-danger">${error}</div>` : null}

      ${reviews.length === 0
        ? html`<div class="card empty"><h3>Nothing here</h3><p>No reviews match this filter.</p></div>`
        : html`<div class="card">
            ${reviews.map((r) => html`
              <div class="rev" key=${r.id}>
                <div class="hd">
                  <span class="who">${r.author_name || 'Anonymous'}</span>
                  <span class="stars">${stars(r.rating)}</span>
                  <span class="faint" style="font-size:12px;text-transform:capitalize">${r.platform}</span>
                  ${statusPill(r.status)}
                  ${r.open_flags > 0 ? html`<${Pill} kind="warn">${r.open_flags} flag${r.open_flags === 1 ? '' : 's'}<//>` : null}
                  ${r.sentiment ? html`<span class="faint" style="font-size:12px">${r.sentiment}</span>` : null}
                </div>
                <p class="body">${r.body}</p>

                ${r.response_body ? html`
                  <div class="reply">
                    <div class="lb">Drafted reply · ${r.response_status}</div>
                    <p>${r.response_body}</p>
                    ${(r.response_status === 'draft' || r.response_status === 'blocked') ? html`
                      <div class="acts">
                        <button class="btn btn-primary btn-sm"
                                disabled=${acting === r.response_id + 'approve'}
                                onClick=${() => act(r.response_id, 'approve')}>
                          ${acting === r.response_id + 'approve' ? html`<span class="spinner"></span> Checking…` : 'Approve'}
                        </button>
                        <button class="btn btn-ghost btn-sm"
                                disabled=${acting === r.response_id + 'reject'}
                                onClick=${() => act(r.response_id, 'reject')}>Reject</button>
                      </div>
                    ` : null}
                    ${r.response_status === 'approved' ? html`
                      <div class="acts">
                        <button class="btn btn-ghost btn-sm"
                                disabled=${acting === r.response_id + 'publish'}
                                onClick=${() => act(r.response_id, 'publish')}>Mark as published</button>
                      </div>
                    ` : null}
                  </div>
                ` : null}
              </div>
            `)}
          </div>`}
    </div>
  `;
}

function App() {
  const [state, setState] = useState({ phase: 'boot' });
  const [businessId, setBusinessId] = useState(qs.get('business') || null);

  const paymentParam = qs.get('payment');

  const boot = useCallback(async () => {
    // 1. Session. The platform gates /api routes, but the page itself is
    //    static, so it has to ask.
    let session = null;
    try { session = await hatchable.auth.getSession(); } catch (e) {}
    if (!session || !session.user) {
      location.href = '/login.html?next=' + encodeURIComponent(location.pathname + location.search);
      return;
    }

    // 2. Which businesses does this user have?
    let me;
    try {
      me = await api('/api/me');
    } catch (e) {
      setState({ phase: 'error', message: e.message });
      return;
    }

    const businesses = me.businesses || [];
    if (!businesses.length) {
      setState({ phase: 'create', user: me.user });
      return;
    }

    const current = businesses.find((b) => b.id === businessId) || businesses[0];

    // 3. Billing, asked of the SERVER every time.
    //
    //    This is the gate that was broken in the Express app: it trusted a
    //    stripeStatus cached in localStorage, so a customer returning from
    //    Stripe Checkout — already activated by the webhook — was bounced
    //    back to the payment page forever. Nothing is cached here.
    let billing = null;
    try {
      billing = await api('/api/billing/status?business_id=' + encodeURIComponent(current.id));
    } catch (e) {
      setState({ phase: 'error', message: e.message });
      return;
    }

    setState({
      phase: billing.entitled ? 'app' : 'pay',
      user: me.user,
      businesses: businesses,
      business: current,
      billing: billing,
    });
  }, [businessId]);

  useEffect(() => { boot(); }, [boot]);

  // Coming back from Stripe, the webhook may land a moment after the redirect.
  // Re-check a few times before concluding the payment did not take.
  useEffect(() => {
    if (paymentParam !== 'success' || state.phase !== 'pay') return;
    let tries = 0;
    const timer = setInterval(() => {
      if (++tries > 5) { clearInterval(timer); return; }
      boot();
    }, 2000);
    return () => clearInterval(timer);
  }, [paymentParam, state.phase, boot]);

  const notice = paymentParam === 'success'
    ? html`<div class="banner banner-ok">Payment received. Your account is active.</div>`
    : paymentParam === 'cancelled'
      ? html`<div class="banner banner-warn">Checkout was cancelled. You can pay whenever you are ready.</div>`
      : null;

  if (state.phase === 'boot') {
    return html`<div class="center"><${Spinner} label="Signing you in…" /><//>`;
  }

  if (state.phase === 'error') {
    return html`<div class="center"><div class="narrow card">
      <h1 style="font-size:18px;margin-bottom:8px">Something went wrong</h1>
      <p class="muted" style="font-size:14px;line-height:1.6">${state.message}</p>
      <button class="btn btn-ghost btn-sm" style="margin-top:14px" onClick=${() => location.reload()}>Try again</button>
    </div></div>`;
  }

  if (state.phase === 'create') {
    return html`<${CreateBusiness} onCreated=${(b) => { setBusinessId(b.id); boot(); }} />`;
  }

  if (state.phase === 'pay') {
    return html`<${PaymentWall} business=${state.business} billing=${state.billing}
                                notice=${notice} onRefresh=${boot} />`;
  }

  return html`<${Dashboard}
    user=${state.user}
    business=${state.business}
    businesses=${state.businesses}
    billing=${state.billing}
    notice=${notice}
    onSwitch=${(id) => { setBusinessId(id); }} />`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
